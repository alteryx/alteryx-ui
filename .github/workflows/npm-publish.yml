# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish in dry-run mode'
        required: false
        default: true
        type: boolean

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'packages/components/package-lock.json'
    - run: npm cache clean --force
    - run: cd packages/components && npm ci && npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
    
    
  publish-npm:
  
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/
          cache: 'npm'
          cache-dependency-path: 'packages/components/package-lock.json'
      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cd packages/components && npm ci && npm run build && npm publish build --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Publish package
        if: github.event_name == 'release' || !inputs.dry_run
        run: cd packages/components && npm ci && npm run build && npm publish build --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
